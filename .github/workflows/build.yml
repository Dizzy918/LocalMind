name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LocalMind
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalMind.xcodeproj \
            -scheme LocalMind \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  test:
    name: Unit tests
    runs-on: macos-26
  
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Test
        # UI tests need a full window-server session and are slow/flaky on
        # headless runners; they're meant for local pre-release verification.
        # CI runs the unit suite, which covers the models and services.
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalMind.xcodeproj \
            -scheme LocalMind \
            -destination 'platform=macOS' \
            -skip-testing:LocalMindUITests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test
