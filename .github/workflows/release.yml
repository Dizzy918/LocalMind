name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-26

    env:
      SCHEME: LocalMind
      CONFIGURATION: Release
      APP_NAME: LocalMind

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # Signing is optional: with an Apple Developer ID the release is signed
      # and notarized; without one (e.g. on a fork) it falls back to an
      # ad-hoc-signed, un-notarized DMG so a tag still produces an artifact.
      - name: Detect signing availability
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
        run: |
          if [ -n "$CERT_P12_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Developer ID secrets set — building an ad-hoc-signed, un-notarized DMG. Gatekeeper will require a right-click → Open on first launch."
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.available == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      # --- Signed path -------------------------------------------------------

      - name: Archive (signed)
        if: steps.signing.outputs.available == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalMind.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            archive

      - name: Export signed .app
        if: steps.signing.outputs.available == 'true'
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist"

      # --- Unsigned fallback path -------------------------------------------

      - name: Build (ad-hoc signed)
        if: steps.signing.outputs.available == 'false'
        run: |
          set -o pipefail
          xcodebuild \
            -project LocalMind.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build
          mkdir -p "$RUNNER_TEMP/export"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/$CONFIGURATION/$APP_NAME.app" "$RUNNER_TEMP/export/"

      # --- DMG (both paths) --------------------------------------------------

      - name: Build DMG
        run: |
          DMG_PATH="$RUNNER_TEMP/$APP_NAME.dmg"
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$RUNNER_TEMP/export/$APP_NAME.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create \
            -volname "$APP_NAME" \
            -srcfolder "$STAGING" \
            -ov -format ULFO \
            "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize and staple
        if: steps.signing.outputs.available == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Compute checksum
        # Record only the bare filename: users verify with `shasum -c` next to
        # their downloaded DMG, and an absolute runner path would never match.
        run: |
          cd "$RUNNER_TEMP"
          shasum -a 256 "$APP_NAME.dmg" | tee "$APP_NAME.dmg.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          files: |
            ${{ env.DMG_PATH }}
            ${{ runner.temp }}/${{ env.APP_NAME }}.dmg.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
